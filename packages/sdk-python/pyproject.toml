[project]
name = "hrvoice"
version = "0.1.0"
description = "Python client for the HRVoice /v1 API: jobs, candidates, screening calls, results and signed webhooks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hrvoice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
